name: IR Collection Experiment APK

on:
  push:
    branches:
      - android/ir-collection-experiment
    paths:
      - "www/**"
      - "native-android/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.ts"
      - ".github/workflows/ir-collection-experiment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated experiment branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build debug APK
        run: npm run android:build
      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: MG30-Studio-IR-Collection-Experiment
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
