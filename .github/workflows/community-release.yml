name: MG30 Studio Community Release (signed candidate)

on:
  push:
    branches:
      - release/community-prep-v2
      - feature/editor-reference-one-screen
    paths:
      - 'www/**'
      - 'tests/**'
      - 'native-android/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/community-release.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Community version tag, e.g. v1.0.0-community.26"
        required: true
        type: string
        default: "v1.0.0-community.26"
      create_draft_release:
        description: "Create a GitHub draft release after the signed APK passes verification"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  signed-community-candidate:
    name: Test, sign, verify and package community APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate release branch
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF_NAME" != "release/community-prep-v2" && "$REF_NAME" != "feature/editor-reference-one-screen" ]]; then
            echo "Run this workflow only from an approved community preparation branch."
            exit 1
          fi

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || 'v1.0.0-community.26' }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-community\.[0-9]+$ ]]; then
            echo "Invalid community release tag: $RELEASE_TAG"
            exit 1
          fi

      - name: Checkout exact release-preparation commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install exact locked dependencies and run regression suite
        run: |
          test -s package-lock.json || { echo 'package-lock.json is required; run Prepare deterministic npm lockfile first.'; exit 1; }
          npm ci
          node --check scripts/init-android.mjs
          npm test

      - name: Prepare and validate release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/mg30-studio-community.p12"
          test -s "$RUNNER_TEMP/mg30-studio-community.p12"
          echo "Keystore Base64 decoded successfully."

          if ! keytool -list -keystore "$RUNNER_TEMP/mg30-studio-community.p12" -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/mg30-keystore-list.txt" 2> "$RUNNER_TEMP/mg30-keystore-error.txt"; then
            echo "::error::Keystore file decoded, but it could not be opened. Check ANDROID_KEYSTORE_PASSWORD."
            cat "$RUNNER_TEMP/mg30-keystore-error.txt"
            exit 1
          fi
          echo "Keystore password accepted."
          if ! grep -Fq "$ANDROID_KEY_ALIAS" "$RUNNER_TEMP/mg30-keystore-list.txt"; then
            echo "::error::Keystore opened, but ANDROID_KEY_ALIAS does not match an entry in this keystore."
            echo "Aliases found (no passwords or key material):"
            sed -n 's/^[[:space:]]*\([^,]*\),.*/  - \1/p' "$RUNNER_TEMP/mg30-keystore-list.txt"
            exit 1
          fi
          echo "Keystore alias found."
          if ! keytool -list -keystore "$RUNNER_TEMP/mg30-studio-community.p12" -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null 2> "$RUNNER_TEMP/mg30-alias-error.txt"; then
            echo "::error::The selected keystore entry could not be read. Check the alias and PKCS12 entry."
            cat "$RUNNER_TEMP/mg30-alias-error.txt"
            exit 1
          fi
          echo "Keystore and alias validation passed."
          echo "MG30_KEYSTORE_PATH=$RUNNER_TEMP/mg30-studio-community.p12" >> "$GITHUB_ENV"

      - name: Generate Android project
        run: npm run android:init

      - name: Configure release signing and version metadata
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v1.0.0-community.26' }}
        run: |
          cat > "$RUNNER_TEMP/mg30-community-signing.init.gradle" <<'GRADLE'
          gradle.beforeProject { project ->
            project.plugins.withId("com.android.application") {
              def androidComponents = project.extensions.findByName("androidComponents")
              androidComponents.finalizeDsl { androidDsl ->
                def signing = androidDsl.signingConfigs.findByName("communityRelease")
                if (signing == null) signing = androidDsl.signingConfigs.create("communityRelease")
                signing.storeFile = new File(System.getenv("MG30_KEYSTORE_PATH"))
                signing.storeType = "PKCS12"
                signing.storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                signing.keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                signing.keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                androidDsl.buildTypes.getByName("release").signingConfig = signing
                androidDsl.defaultConfig.versionCode = 26
                androidDsl.defaultConfig.versionName = System.getenv("RELEASE_TAG").replaceFirst("^v", "")
              }
            }
          }
          GRADLE
          echo "MG30_SIGNING_INIT=$RUNNER_TEMP/mg30-community-signing.init.gradle" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ inputs.release_tag || 'v1.0.0-community.26' }}
        run: |
          cd android
          ./gradlew --no-daemon assembleRelease -I "$MG30_SIGNING_INIT"

      - name: Verify APK, package identity and checksum
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee android/app/build/outputs/apk/release/signature-verification.txt
          grep -Eq "V2 Signer: certificate SHA-256 digest: [0-9a-f]{64}" android/app/build/outputs/apk/release/signature-verification.txt
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee android/app/build/outputs/apk/release/apk-badging.txt
          grep -q "package: name='com.vaivaii.mg30studio'" android/app/build/outputs/apk/release/apk-badging.txt
          cd "$GITHUB_WORKSPACE"
          cp android/app/build/outputs/apk/release/app-release.apk MG30-Studio-Community.apk
          sha256sum MG30-Studio-Community.apk > MG30-Studio-Community.apk.sha256
          sha256sum --check MG30-Studio-Community.apk.sha256
          cp android/app/build/outputs/apk/release/signature-verification.txt MG30-Studio-Community-signature.txt
          cp android/app/build/outputs/apk/release/apk-badging.txt MG30-Studio-Community-package-info.txt

      - name: Upload signed APK audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: MG30-Studio-Community-Signed-Candidate
          path: |
            MG30-Studio-Community.apk
            MG30-Studio-Community.apk.sha256
            MG30-Studio-Community-signature.txt
            MG30-Studio-Community-package-info.txt
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub draft release (optional)
        if: inputs.create_draft_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: MG30 Studio ${{ inputs.release_tag }} — Community Edition
          draft: true
          prerelease: true
          make_latest: false
          body: |
            MG30 Studio Community Edition for the original NUX MG-30 Gen 2, firmware 6.0.x.

            This is a signed Community .26 candidate for the original NUX MG-30 Gen 2, firmware 6.0.x, from the Editor reference branch. Physical installation and MG-30 hardware checks are still required before acceptance. It remains a draft until the owner completes signing, installation, hardware, documentation and release-readiness checks.

            Verify the SHA-256 checksum before installation. Review the compatibility and known-limitations notes before using device-write operations.

            Independent community project; not affiliated with NUX.
          files: |
            MG30-Studio-Community.apk
            MG30-Studio-Community.apk.sha256
            MG30-Studio-Community-signature.txt
            MG30-Studio-Community-package-info.txt
          fail_on_unmatched_files: true
