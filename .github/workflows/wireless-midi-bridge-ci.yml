name: Wireless MIDI Bridge CI

on:
  push:
    branches:
      - feature/wireless-midi-bridge-2026-11-25
    paths:
      - 'index.html'
      - 'native-android/**'
      - 'native-midi-*.js'
      - 'tests/**'
      - 'scripts/init-android.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/wireless-midi-bridge-ci.yml'
  pull_request:
    branches:
      - feature/wireless-midi-bridge-2026-11-25
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wireless-midi-bridge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test routing and build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked dependencies
        run: npm ci

      - name: Check JavaScript and Android generator syntax
        run: |
          node --check scripts/init-android.mjs
          node --check native-midi-bridge.js
          node --check native-midi-routing.js

      - name: Run regression suite
        run: npm test

      - name: Build Android debug APK
        run: npm run android:build

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MG30-Studio-Wireless-MIDI-Bridge-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
