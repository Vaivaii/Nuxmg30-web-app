name: Build MG30 Studio Android APK

on:
  push:
    branches:
      - android/mg30-studio-apk
      - android/mg30-studio-apk-gen2-image-nam
      - android/nam-slot-readback-probe
      - android/nam-transfer-tone3000
    paths:
      - 'www/**'
      - 'native-android/**'
      - 'scripts/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'vite.config.js'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install JavaScript dependencies
        run: npm install
      - name: Generate Capacitor Android project and install USB audio plugin
        run: npm run android:init
      - name: Build debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MG30-Studio-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
