name: English UI validation (no APK)

on:
  push:
    branches:
      - feature/dark-performance-ui-polish
    paths:
      - 'www/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  validate-english-ui:
    name: Validate English UI and protocol tests (no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check English UI JavaScript syntax
        run: node --check www/english-ui.js
      - name: Run protocol regression tests
        run: npm test
      - name: Build web assets only (no Android project or APK)
        run: npm run build
